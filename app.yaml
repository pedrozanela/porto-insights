# Porto Insights — comando de start e env vars do Databricks Apps.
# Nenhum segredo aqui. A auth é OBO (token do usuário via header). Os valores de MODEL_ENDPOINTS,
# DEFAULT_MODEL_ENDPOINT e SQL_WAREHOUSE_ID vêm da descoberta da Fase 0 (docs/discovery.md).
# sh -c para o shell expandir $DATABRICKS_APP_PORT (o array de command não faz substituição).
command:
  - sh
  - -c
  - uvicorn backend.main:app --host 0.0.0.0 --port $DATABRICKS_APP_PORT

env:
  - name: PORTO_CATALOG
    value: pzanela_classic_aws_catalog
  - name: PORTO_SCHEMA
    value: porto_insights
  - name: SQL_WAREHOUSE_ID
    value: "848374d85d2bad86"
  # Model Service NOMEADO criado no AI Gateway: routing server-side (Sonnet 5 + GPT-5.5, 50/50) com
  # fallback Opus 5. UM choke point governado (system.ai_gateway.usage + rate limits + policies). O
  # app manda sempre este nome; o gateway decide a rota. Invocado via MODEL_SERVING_PATH. É um
  # securable do UC (pzanela_classic_aws_catalog.porto_insights) — o SP do app precisa de EXECUTE.
  - name: MODEL_ENDPOINTS
    value: "pzanela_classic_aws_catalog.porto_insights.porto_insights_gateway:Porto Insights Gateway"
  - name: DEFAULT_MODEL_ENDPOINT
    value: pzanela_classic_aws_catalog.porto_insights.porto_insights_gateway
  - name: MODEL_SERVING_PATH
    value: "/ai-gateway/mlflow/v1"
  - name: GENIE_MAX_WAIT_S
    value: "260"
  - name: MCP_GOOGLE_SERVICES
    value: "system.ai.gmail,system.ai.google_calendar,system.ai.google_drive"
  - name: MCP_WEB_SEARCH_ENABLED
    value: "true"
  - name: AGENT_MAX_TOOL_ITERATIONS
    value: "14"
  - name: SEMANTIC_LINKER_MIN_CONFIDENCE
    value: "0.6"
  # Linker do grafo (extração de relações em JSON, roda a cada turno): fica no Haiku DIRETO, NÃO no
  # routing gateway acima — rotear essa tarefa mecânica por Sonnet/GPT/Opus seria caro e mais lento
  # sem ganho. Trocar para o gateway nomeado é só copiar o valor de DEFAULT_MODEL_ENDPOINT aqui.
  - name: LINKER_MODEL
    value: "system.ai.claude-haiku-4-5"
  # Chamadas de MODELO com a identidade do SP do app (M2M) em vez de OBO. Dados seguem OBO.
  - name: MODELS_USE_SP
    value: "true"
  - name: TIME_WINDOW_DAYS
    value: "3"
  - name: LOG_LEVEL
    value: INFO
  # MLflow Tracing (observabilidade por turno). Vazio = desligado. Aqui aponta pro experimento
  # do FEVM (o SP do app tem CAN_EDIT). Em outro workspace, use um experimento com acesso restrito.
  - name: MLFLOW_EXPERIMENT_PATH
    value: "/Users/pedro.zanela@databricks.com/porto-insights-traces"
