<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porto Insights</title>
    <link rel="icon" href="/public/porto-symbol.png" type="image/png" />

    <!--
      Frontend SEM build e sem npm: frontend/src/ é React + TypeScript (TSX) comum, e o próprio
      navegador traduz cada arquivo para JavaScript na hora de carregar (Sucrase, ~20 ms no total).
      - Telas e lógica: edite frontend/src/ (componentes .tsx, JSX normal).
      - Bibliotecas: frontend/vendor/ (geradas por scripts/build_vendor.sh — NÃO editar).
      - Estilos: classes do Tailwind v3 direto nos componentes; tokens de cor e CSS global abaixo.
      - Erros de uma edição aparecem no console do navegador (F12), com arquivo e linha.
    -->

    <!-- Tailwind v3 no navegador: gera o CSS das classes usadas, em tempo de execução. -->
    <script src="/vendor/tailwind.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Consomem as CSS variables do :root (abaixo).
              primary: "var(--color-primary)",
              primaryDark: "var(--color-primary-dark)",
              accent: "var(--color-accent)",
              surface: "var(--color-surface)",
              surfaceMuted: "var(--color-surface-muted)",
              borderc: "var(--color-border)",
              textc: "var(--color-text)",
              muted: "var(--color-muted)",
              bubbleUser: "var(--color-bubble-user)",
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
            },
            borderRadius: { xl: "0.75rem" },
            boxShadow: { soft: "0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04)" },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @tailwind base;
      @tailwind components;
      @tailwind utilities;

      /* Tokens de marca da Porto (oficiais, do app ai-prism-porto). Espelhados em src/theme.ts.
         Azul da vela = #00a1fc; primary usa o azul profundo #005bbf para contraste de texto branco. */
      :root {
        --color-primary: #005bbf;       /* azul Porto profundo — botões, links, estados selecionados */
        --color-primary-dark: #00408c;  /* hover/pressed */
        --color-accent: #00a1fc;        /* azul da vela — acento de marca, destaques */
        --color-surface: #FFFFFF;
        --color-surface-muted: #F7F8FA;
        --color-border: #E2E6EA;
        --color-text: #1A1F24;
        --color-muted: #5C6670;
        --color-bubble-user: #E9F3FC;
      }

      html, body, #root { height: 100%; }
      body { margin: 0; background: var(--color-surface-muted); color: var(--color-text); }

      /* Markdown das respostas do assistente (leve; sem plugin de tipografia). */
      .prose-chat { font-size: 0.95rem; line-height: 1.55; }
      .prose-chat > :first-child { margin-top: 0; }
      .prose-chat > :last-child { margin-bottom: 0; }
      .prose-chat p { margin: 0.5rem 0; }
      .prose-chat h1, .prose-chat h2, .prose-chat h3 { font-weight: 600; margin: 0.8rem 0 0.4rem; line-height: 1.3; }
      .prose-chat h1 { font-size: 1.15rem; }
      .prose-chat h2 { font-size: 1.05rem; }
      .prose-chat h3 { font-size: 1rem; }
      .prose-chat ul, .prose-chat ol { margin: 0.5rem 0; padding-left: 1.25rem; }
      .prose-chat li { margin: 0.15rem 0; }
      .prose-chat strong { font-weight: 650; }
      .prose-chat a { color: var(--color-primary); text-decoration: underline; }
      .prose-chat code { background: var(--color-surface-muted); padding: 0.1rem 0.3rem; border-radius: 0.3rem; font-size: 0.85em; }
      .prose-chat table { border-collapse: collapse; margin: 0.6rem 0; font-size: 0.9rem; display: block; overflow-x: auto; }
      .prose-chat th, .prose-chat td { border: 1px solid var(--color-border); padding: 0.35rem 0.6rem; text-align: left; }
      .prose-chat th { background: var(--color-surface-muted); font-weight: 600; }
    </style>

    <!--
      Tradução TSX/JSX → JS: o es-module-shims carrega cada módulo de /src/ e o passa pelo Sucrase
      ANTES de executar (tira os tipos e o JSX). Se o Sucrase acusar erro de sintaxe, o Babel (só
      baixado nesse caso) refaz a análise para mostrar a linha e o trecho exatos do erro.
    -->
    <script>
      window.esmsInitOptions = {
        shimMode: true,
        async fetch(url, options) {
          const res = await fetch(url, options);
          const path = new URL(res.url).pathname;
          const ext = path.match(/^\/src\/.*\.(tsx|ts|jsx)$/)?.[1];
          if (!res.ok || !ext) return res;
          const source = await res.text();
          const { transform } = await import("/vendor/sucrase.js");
          const transforms = ext === "ts" ? ["typescript"] : ext === "tsx" ? ["typescript", "jsx"] : ["jsx"];
          let code;
          try {
            ({ code } = transform(source, { transforms, jsxRuntime: "automatic", production: true, filePath: path }));
          } catch (err) {
            throw new SyntaxError(await describeSyntaxError(source, path, ext, err));
          }
          // sourceURL: erros e o DevTools mostram o arquivo real (/src/...tsx), não um blob:
          return new Response(new Blob([`${code}\n//# sourceURL=${res.url}`], { type: "application/javascript" }));
        },
      };

      // Mensagem precisa (linha + trecho do código) via Babel; se nem ele carregar, fica a do Sucrase.
      async function describeSyntaxError(source, path, ext, err) {
        try {
          if (!window.Babel) {
            await new Promise((ok, fail) => {
              const s = Object.assign(document.createElement("script"), { src: "/vendor/babel.min.js", onload: ok, onerror: fail });
              document.head.appendChild(s);
            });
          }
          const presets = ext === "jsx" ? ["react"] : [["typescript", {}], "react"];
          window.Babel.transform(source, { filename: path, presets });
        } catch (babelErr) {
          if (babelErr && babelErr.loc) return `Erro de sintaxe — ${babelErr.message}`; // já inclui o arquivo
        }
        return `Erro de sintaxe em ${path}: ${err.message}`;
      }
    </script>
    <script async src="/vendor/es-module-shims.js"></script>

    <!-- Import map: nome de cada biblioteca → arquivo em /vendor (nada é baixado da internet). -->
    <script type="importmap-shim">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react/jsx-runtime": "/vendor/react-jsx-runtime.js",
          "react-dom/client": "/vendor/react-dom-client.js",
          "react-markdown": "/vendor/react-markdown.js",
          "remark-gfm": "/vendor/remark-gfm.js",
          "react-force-graph-2d": "/vendor/react-force-graph-2d.js",
          "d3-force": "/vendor/d3-force.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module-shim" src="/src/main.tsx"></script>
  </body>
</html>
